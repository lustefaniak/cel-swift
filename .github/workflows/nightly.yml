name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Seconds per fuzzer
        default: "1800"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore the generated corpus
        uses: actions/cache/restore@v4
        with:
          path: .build-fuzz-work/corpus-*
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Build the fuzzers
        run: Fuzz/build.sh
      - name: Replay the seed corpus and regressions
        run: Fuzz/run-all.sh replay
      - name: Fuzz each target
        run: Fuzz/run-all.sh "${{ github.event.inputs.fuzz_seconds || '1800' }}"
      - name: Save the generated corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .build-fuzz-work/corpus-*
          key: fuzz-corpus-${{ github.run_id }}
      - name: Upload crashing inputs and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: |
            .build-fuzz-work/artifacts
            .build-fuzz-work/*.log
          if-no-files-found: ignore

  # differential: reserved for the cel-go differential suite with fresh seeds
  # (CEL_DIFF_SEEDS=random swift test --filter CELDifferentialTests); the M4 differential-suite
  # work fills in this job.
