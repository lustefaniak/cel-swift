name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - run: swift --version
      - run: swift build --build-tests
      - run: swift test --skip-build
      - name: Conformance dashboard
        run: python3 tools/dashboard/dashboard.py --stale

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "6.1"]
    container: swift:${{ matrix.swift }}-noble
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: swift --version
      - run: swift build --build-tests
      - run: swift test --skip-build

  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/oracle/go.mod
          cache-dependency-path: tools/oracle/go.sum
      - name: Build and test the cel-go oracle
        working-directory: tools/oracle
        run: |
          go vet ./...
          go build .
          go test ./...

  fuzz:
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build the fuzzers
        run: Fuzz/build.sh
      - name: Replay the seed corpus and regressions
        run: Fuzz/run-all.sh replay
      - name: Fuzz each target for 60 seconds
        run: Fuzz/run-all.sh 60
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: |
            .build-fuzz-work/artifacts
            .build-fuzz-work/*.log
          if-no-files-found: ignore
